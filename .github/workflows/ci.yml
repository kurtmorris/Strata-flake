name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Flake check
        run: nix flake check --no-build
      - name: Evaluate the packages
        run: |
          nix eval .#packages.x86_64-linux.strata.drvPath
          nix eval .#packages.x86_64-linux.strata-engine.drvPath
      - name: models.json matches the pinned setup.py
        run: |
          src=$(nix flake archive --json | jq -r .inputs.strata.path)
          nix shell nixpkgs#python3 -c python3 scripts/gen-models.py "$src" | diff -u models.json -
